# Render Blueprint
services:
  - type: web
    name: realestate-realestate-001-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: realestate-realestate-001-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: realestate-realestate-001-db
    databaseName: realestate_realestate_001
